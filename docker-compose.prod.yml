services:
  # ============================================================================
  # PostgreSQL Database Service
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: cab_booking_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cab_booking_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cab_booking_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cab_booking_prod_network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ============================================================================
  # NestJS Production Backend API Service
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile.prod
    container_name: cab_booking_backend_prod
    restart: always
    env_file:
      - path: ./backend/.env.prod
        required: false
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-cab_booking_db}
      JWT_SECRET: ${JWT_SECRET:-cab_booking_production_jwt_secret_key_2026}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cabbooking.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminPassword123!}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    ports:
      - "${BACKEND_PORT:-3000}:3010"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cab_booking_prod_network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ============================================================================
  # React Vite Admin Panel & Nginx Reverse Proxy
  # ============================================================================
  admin:
    build:
      context: ./admin
      dockerfile: dockerfile.prod
      args:
        - VITE_API_URL=/api
    container_name: cab_booking_admin_prod
    restart: always
    ports:
      - "${ADMIN_PORT:-8000}:5170"
    depends_on:
      - backend
    networks:
      - cab_booking_prod_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ==============================================================================
# Networks & Persistent Volumes
# ==============================================================================
networks:
  cab_booking_prod_network:
    driver: bridge

volumes:
  postgres_prod_data:
    driver: local
  backend_uploads:
    driver: local
